services:

  api:
    build: ./services/api
    container_name: api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    volumes:
      - ./services/api:/app


  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
 
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
 
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: always
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # FIX: Mount custom config that enables built-in Keeper (replaces ZooKeeper)
      # and defines the "default" cluster so ON CLUSTER DDL works on a single node
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/langfuse.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=clickhouse", "--password=clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  minio:
    image: minio/minio
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - minio_data:/data
 
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
 
      NEXTAUTH_URL: http://localhost:3001
      AUTH_GOOGLE_CLIENT_ID: 683461448228-nqqr37gbqcsi6f0ng2iagv3bch87l9a4.apps.googleusercontent.com
      AUTH_GOOGLE_CLIENT_SECRET: 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
      AUTH_GOOGLE_ALLOW_ACCOUNT_LINKING: "true"
      NEXTAUTH_SECRET: supersecret
      SALT: supersecret
 
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse@clickhouse:9000/default
 
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
 
      REDIS_HOST: redis
      REDIS_PORT: 6379
 
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_BUCKET_NAME: langfuse
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio123
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
 
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  clickhouse_data:
  minio_data:

